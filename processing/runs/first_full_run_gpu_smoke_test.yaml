# End-to-end CUDA smoke test for the first full run configuration.
# It processes one Jember recording plus all eligible development clips, then
# caps training at 40 rows and five optimizer steps. The speaker-defined eval
# set remains complete and is not reduced by the training preview limits.
run_name: first_full_run_gpu_smoke_test

pipeline:
  output_dir: processed_indonesia/first_full_run_gpu_smoke_test
  max_recordings: 1
  jember_clips: 50
  min_clip_seconds: 3.0
  max_clip_seconds: 30.0
  min_words: 2
  jember_stride_overlap_rows: 2
  prepare_workers: 8
  reuse_existing: true
  audio_seconds: 5.0
  word_search_amount: 13
  match_words: 2
  closeness_metric: levenshtein
  start_match_model: indonesian-nlp/wav2vec2-indonesian-javanese-sundanese
  start_match_device: cuda
  noise_dir: indonesian_data/room_noises
  noise_copies_per_clip: 1
  noise_augmentation_fraction: 0.2
  min_noise_fraction: 0.25
  max_noise_fraction: 0.75
  min_snr_db: 5.0
  max_snr_db: 20.0
  augmentation_seed: 1337
  augment_workers: 8

prepare:
  output_dir: processed_indonesia/first_full_run_gpu_smoke_test/01_segments
  manifest: processed_indonesia/first_full_run_gpu_smoke_test/01_segments.csv
  max_recordings: 1
  jember_clips: 50
  min_clip_seconds: 3.0
  max_clip_seconds: 30.0
  min_words: 2
  jember_stride_overlap_rows: 2
  prepare_workers: 8
  reuse_existing: true

match:
  clips: processed_indonesia/first_full_run_gpu_smoke_test/01_segments.csv
  output: processed_indonesia/first_full_run_gpu_smoke_test/clip_start_matches.json
  output_csv: processed_indonesia/first_full_run_gpu_smoke_test/02_processed.csv
  audio_seconds: 5.0
  word_search_amount: 13
  match_words: 2
  closeness_metric: levenshtein
  model: indonesian-nlp/wav2vec2-indonesian-javanese-sundanese
  device: cuda

augment:
  input: processed_indonesia/first_full_run_gpu_smoke_test/02_processed.csv
  output: processed_indonesia/first_full_run_gpu_smoke_test/03_dataset_with_augmented.csv
  output_dir: processed_indonesia/first_full_run_gpu_smoke_test/03_augmented_audio
  noise_dir: indonesian_data/room_noises
  copies_per_clip: 1
  augmentation_fraction: 0.2
  min_noise_fraction: 0.25
  max_noise_fraction: 0.75
  min_snr_db: 5.0
  max_snr_db: 20.0
  seed: 1337
  workers: 8

train:
  manifest: processed_indonesia/first_full_run_gpu_smoke_test/03_dataset_with_augmented.csv
  output_dir: processed_indonesia/first_full_run_gpu_smoke_test/05_whisper_small
  base_model: small
  language: id
  epochs: 1
  batch_size: 4
  num_workers: 4
  max_samples: 40
  max_train_steps: 5
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0
  learning_rate: 0.0001
  weight_decay: 0.01
  eval_every_steps: 5
  device: cuda
  wandb_project: indonesian-whisper-small-lora
  wandb_run_name: first-full-run-gpu-smoke-test
  wandb_mode: disabled
