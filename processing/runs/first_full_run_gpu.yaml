# Full SageMaker/CUDA run: prepare -> match -> room-noise augmentation -> train.
# There are deliberately no recording, clip, sample, or training-step limits.
# Speed/pitch augmentation is not configured and is not invoked by this pipeline.
run_name: first_full_run_gpu

pipeline:
  output_dir: processed_indonesia/first_full_run_gpu
  min_clip_seconds: 3.0
  max_clip_seconds: 30.0
  min_words: 2
  jember_stride_overlap_rows: 2
  prepare_workers: 8
  reuse_existing: true
  audio_seconds: 5.0
  word_search_amount: 13
  match_words: 2
  closeness_metric: levenshtein
  start_match_model: indonesian-nlp/wav2vec2-indonesian-javanese-sundanese
  start_match_device: cuda
  noise_dir: indonesian_data/room_noises
  jember_augmentation_multiplier: 0.5
  development_augmentation_multiplier: 5.0
  min_noise_fraction: 0.25
  max_noise_fraction: 0.75
  min_snr_db: 5.0
  max_snr_db: 20.0
  augmentation_seed: 1337
  augment_workers: 8

prepare:
  output_dir: processed_indonesia/first_full_run_gpu/01_segments
  manifest: processed_indonesia/first_full_run_gpu/01_segments.csv
  min_clip_seconds: 3.0
  max_clip_seconds: 30.0
  min_words: 2
  jember_stride_overlap_rows: 2
  prepare_workers: 8
  reuse_existing: true

match:
  clips: processed_indonesia/first_full_run_gpu/01_segments.csv
  output: processed_indonesia/first_full_run_gpu/clip_start_matches.json
  output_csv: processed_indonesia/first_full_run_gpu/02_processed.csv
  audio_seconds: 5.0
  word_search_amount: 13
  match_words: 2
  closeness_metric: levenshtein
  model: indonesian-nlp/wav2vec2-indonesian-javanese-sundanese
  device: cuda

augment:
  input: processed_indonesia/first_full_run_gpu/02_processed.csv
  output: processed_indonesia/first_full_run_gpu/03_dataset_with_augmented.csv
  output_dir: processed_indonesia/first_full_run_gpu/03_augmented_audio
  noise_dir: indonesian_data/room_noises
  jember_augmentation_multiplier: 0.5
  development_augmentation_multiplier: 5.0
  min_noise_fraction: 0.25
  max_noise_fraction: 0.75
  min_snr_db: 5.0
  max_snr_db: 20.0
  seed: 1337
  workers: 8

train:
  manifest: processed_indonesia/first_full_run_gpu/03_dataset_with_augmented.csv
  output_dir: processed_indonesia/first_full_run_gpu/05_whisper_small_dataset_multipliers
  base_model: small
  language: id
  epochs: 10
  batch_size: 9
  num_workers: 4
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0
  learning_rate: 0.0001
  weight_decay: 0.01
  eval_every_steps: 600
  device: cuda
  wandb_project: indonesian-whisper-small-lora
  wandb_run_name: first-full-run-gpu-dataset-multipliers
  wandb_mode: online
