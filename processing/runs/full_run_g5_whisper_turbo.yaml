# Training-only Whisper Turbo run using the existing processed and augmented
# dataset produced by full_run_g5_whisper_medium.yaml.
run_name: full_run_g5_whisper_turbo

train:
  manifest: processed_indonesia/full_run_g5_whisper_medium/03_dataset_with_augmented.csv
  output_dir: processed_indonesia/full_run_g5_whisper_medium/05_whisper_turbo
  base_model: turbo
  language: id
  epochs: 10
  batch_size: 12
  num_workers: 8
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0
  learning_rate: 0.0001
  weight_decay: 0.01
  eval_every_steps: 600
  device: cuda
  wandb_project: indonesian-whisper-turbo-lora
  wandb_run_name: full-run-g5-whisper-turbo
  wandb_mode: online
