# Full data-mix run: 40% Jember, 40% Common Voice, 20% Indonesian development.
run_name: first_full_run_data_mix_commonvoice

pipeline:
  output_dir: processed_indonesia/first_full_run_data_mix_commonvoice
  min_clip_seconds: 6.0
  max_clip_seconds: 30.0
  jember_min_clip_seconds: 10.0
  jember_max_clip_seconds: 25.0
  development_min_clip_seconds: 6.0
  development_max_clip_seconds: 30.0
  development_corrected_long_clips: indonesian_data/indonesian_dev/corrected_above30seconds_indonesian_dev.csv
  development_corrected_long_audio_dir: indonesian_data/indonesian_dev/corrected_above30seconds_audio
  commonvoice-clips-per-dataset: 300
  commonvoice-code-switch-samples: 2000
  commonvoice-seed: 1337
  min_words: 2
  jember_stride_overlap_rows: 0
  prepare_workers: 16
  reuse_existing: true
  audio_seconds: 5.0
  word_search_amount: 13
  match_words: 2
  closeness_metric: levenshtein
  start_match_model: indonesian-nlp/wav2vec2-indonesian-javanese-sundanese
  start_match_device: cuda
  noise_dir: indonesian_data/room_noises
  jember_augmentation_multiplier: 0.1
  development_augmentation_multiplier: 2.0
  commonvoice_augmentation_multiplier: 0.5
  min_noise_fraction: 0.25
  max_noise_fraction: 0.75
  min_snr_db: 5.0
  max_snr_db: 20.0
  augmentation_seed: 1337
  augment_workers: 16

prepare:
  output_dir: processed_indonesia/first_full_run_data_mix_commonvoice/01_segments
  manifest: processed_indonesia/first_full_run_data_mix_commonvoice/01_segments.csv
  commonvoice-clips-per-dataset: 300
  commonvoice-code-switch-samples: 2000
  commonvoice-seed: 1337
  min_clip_seconds: 6.0
  max_clip_seconds: 30.0
  jember_min_clip_seconds: 10.0
  jember_max_clip_seconds: 25.0
  development_min_clip_seconds: 6.0
  development_max_clip_seconds: 30.0
  min_words: 2
  jember_stride_overlap_rows: 0
  prepare_workers: 16
  reuse_existing: true

augment:
  input: processed_indonesia/first_full_run_data_mix_commonvoice/02_processed.csv
  output: processed_indonesia/first_full_run_data_mix_commonvoice/03_dataset_with_augmented.csv
  output_dir: processed_indonesia/first_full_run_data_mix_commonvoice/03_augmented_audio
  noise_dir: indonesian_data/room_noises
  jember_augmentation_multiplier: 0.1
  development_augmentation_multiplier: 2.0
  commonvoice_augmentation_multiplier: 0.5
  min_noise_fraction: 0.25
  max_noise_fraction: 0.75
  min_snr_db: 5.0
  max_snr_db: 20.0
  seed: 1337
  workers: 16

train:
  manifest: processed_indonesia/first_full_run_data_mix_commonvoice/03_dataset_with_augmented.csv
  output_dir: processed_indonesia/first_full_run_data_mix_commonvoice/05_train
  base_model: large-v3
  language: id
  epochs: 10
  batch_size: 2
  num_workers: 8
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.1
  learning_rate: 0.0001
  weight_decay: 0.01
  device: cuda
  eval_decode_batch_size: 4
  eval_total_clips: 150
  jember_percentage: 25
  commonvoice_percentage: 35
  eval_jember_proportion: 25
  eval_commonvoice_proportion: 35
  eval_every_steps: 600
  wandb_project: indonesian-whisper-medium-lora
  wandb_run_name: first-full-run-data-mix-commonvoice
  wandb_mode: online
