# Recreate the window-preview flow, add room noise, and train Whisper Small.
run_name: window_preview_noise_whisper_small

pipeline:
  output_dir: processed_indonesia/window_preview_noise
  max_recordings: 1
  jember_clips: 500
  min_clip_seconds: 3.0
  max_clip_seconds: 40.0
  min_words: 2
  reuse_existing: true
  audio_seconds: 5.0
  word_search_amount: 13
  match_words: 2
  closeness_metric: levenshtein
  start_match_model: indonesian-nlp/wav2vec2-indonesian-javanese-sundanese
  start_match_device: auto
  noise_dir: indonesian_data/room_noises
  noise_copies_per_clip: 1
  min_noise_fraction: 0.25
  max_noise_fraction: 0.75
  min_snr_db: 5.0
  max_snr_db: 20.0
  augmentation_seed: 1337

prepare:
  output_dir: processed_indonesia/window_preview_noise/01_segments
  manifest: processed_indonesia/window_preview_noise/01_segments.csv
  max_recordings: 1
  jember_clips: 500
  min_clip_seconds: 3.0
  max_clip_seconds: 40.0
  min_words: 2
  reuse_existing: true

match:
  clips: processed_indonesia/window_preview_noise/01_segments.csv
  output: processed_indonesia/window_preview_noise/clip_start_matches.json
  output_csv: processed_indonesia/window_preview_noise/02_processed.csv
  audio_seconds: 5.0
  word_search_amount: 13
  match_words: 2
  closeness_metric: levenshtein
  model: indonesian-nlp/wav2vec2-indonesian-javanese-sundanese
  device: auto

augment:
  input: processed_indonesia/window_preview_noise/02_processed.csv
  output: processed_indonesia/window_preview_noise/03_dataset_with_augmented.csv
  output_dir: processed_indonesia/window_preview_noise/03_augmented_audio
  noise_dir: indonesian_data/room_noises
  copies_per_clip: 1
  min_noise_fraction: 0.25
  max_noise_fraction: 0.75
  min_snr_db: 5.0
  max_snr_db: 20.0
  seed: 1337

train:
  output_dir: processed_indonesia/window_preview_noise/05_whisper_small_full
  base_model: small
  language: id
  epochs: 20
  batch_size: 4
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0
  learning_rate: 0.0001
  weight_decay: 0.01
  eval_indonesian_dev_clips: 10
  eval_jember_clips: 10
  eval_set_size: 20
  eval_every_steps: 250
  device: mps
  wandb_project: indonesian-whisper-small-lora
  wandb_run_name: whisper-small-full-room-noise
  wandb_mode: online
