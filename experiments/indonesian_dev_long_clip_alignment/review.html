<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Long development clip alignment</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172326;background:#eef3f1;--navy:#173f43;--line:#d7e0de;--muted:#657775}*{box-sizing:border-box}body{margin:0}header{background:var(--navy);color:white;padding:24px}.wrap{width:min(1400px,calc(100% - 28px));margin:auto}h1{margin:0 0 6px}header p{margin:0;color:#d8e8e6}.controls{display:flex;align-items:center;gap:12px;padding:18px 0;flex-wrap:wrap}.controls input{flex:1;min-width:180px}.controls input,.controls button{font:inherit;padding:9px;border:1px solid #aebcba;border-radius:7px;background:white}.controls .primary{background:var(--navy);color:white;border-color:var(--navy)}.save-status{width:100%;min-height:1.2em;color:var(--muted);font-size:.9rem}.summary{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.clips{display:grid;grid-template-columns:1fr 1fr;gap:14px}.clip{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}.clip audio{width:100%;margin:10px 0}.clip textarea{display:block;width:100%;min-height:160px;resize:vertical;font:inherit;line-height:1.55;padding:12px;border:1px solid #9eafac;border-radius:7px;background:#fff}.label{display:block;color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:15px 0 4px}.text{line-height:1.55;white-space:pre-wrap}.prediction{background:#f5f8f7;padding:12px;border-radius:7px}.boundary{background:#fff1cc;padding:10px;border-radius:7px}.error{color:#9a241b}@media(max-width:800px){.clips{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><h1>Long development clip alignment</h1><p>Silence-based audio split with editable transcript corrections.</p></div></header><main class="wrap"><div class="controls"><button id="alignment-previous" type="button">← Previous</button><input id="alignment-position" type="range" min="0" value="0"><button id="alignment-next" type="button">Next →</button><button id="save-corrections" class="primary" type="button">Save corrected CSV</button><button id="download-corrections" type="button">Download CSV</button><div id="save-status" class="save-status" aria-live="polite"></div></div><div id="alignment-content">Loading…</div></main>
<script>
const query=new URLSearchParams(location.search),dataUrl=new URL(query.get('data')||'output/split_alignment_results.csv',location.href);let rows=[],current=0;const storageKey=`long-clip-corrections:${dataUrl.pathname}`;const $=id=>document.getElementById(id),escapeHtml=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function parseCsv(text){const output=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))output.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);output.push(row)}const header=output.shift()||[];return output.map(values=>Object.fromEntries(header.map((key,i)=>[key,values[i]||''])))}
function audioUrl(path){return new URL(path,dataUrl)}
function move(offset){current=(current+rows.length+offset)%rows.length;show()}
function clip(number,row){
  const prefix=`clip_${number}_`;
  const corrected=row[prefix+'corrected_transcript']??row[prefix+'transcript'];
  return `<article class="clip"><h2>Clip ${number}</h2><audio controls preload="metadata" src="${escapeHtml(audioUrl(row[prefix+'audio']))}"></audio><label class="label" for="transcript-${number}">Corrected transcript</label><textarea id="transcript-${number}" data-transcript-number="${number}">${escapeHtml(corrected)}</textarea><span class="label">Wav2Vec2 prediction</span><div class="text prediction">${escapeHtml(row[prefix+'prediction'])}</div><span class="label">Boundary match</span><div class="boundary">${escapeHtml(row[prefix+'boundary_phrase'])} · distance ${escapeHtml(row[prefix+'distance'])}</div></article>`
}
function persistCorrections(){const corrections=rows.map(row=>[row.clip_1_corrected_transcript??row.clip_1_transcript,row.clip_2_corrected_transcript??row.clip_2_transcript]);localStorage.setItem(storageKey,JSON.stringify(corrections))}
function restoreCorrections(){try{const corrections=JSON.parse(localStorage.getItem(storageKey));if(!Array.isArray(corrections))return;rows.forEach((row,index)=>{if(Array.isArray(corrections[index])){row.clip_1_corrected_transcript=corrections[index][0];row.clip_2_corrected_transcript=corrections[index][1]}})}catch(error){console.warn('Could not restore transcript edits',error)}}
function show(){if(!rows.length)return;const row=rows[current];$('alignment-position').value=current;$('alignment-content').innerHTML=`<section class="summary"><strong>${current+1} / ${rows.length} · ${escapeHtml(row.original_audio.split('/').pop())}</strong><div class="text">Original ${escapeHtml(row.duration_seconds)}s · split at ${escapeHtml(row.split_seconds)}s · detected silence ${escapeHtml(row.silence_duration_seconds)}s · ${escapeHtml(row.split_method)} · joint score ${escapeHtml(row.joint_score)} · average distance ${escapeHtml(row.average_distance)}</div></section><section class="clips">${clip(1,row)}${clip(2,row)}</section>`;document.querySelectorAll('[data-transcript-number]').forEach(textarea=>textarea.addEventListener('input',event=>{const prefix=`clip_${event.target.dataset.transcriptNumber}_`;row[prefix+'corrected_transcript']=event.target.value;persistCorrections();$('save-status').textContent='Unsaved changes'}))}
function repositoryPath(path){const resolved=new URL(path,dataUrl).pathname;const marker=resolved.indexOf('/experiments/');return marker>=0?resolved.slice(marker+1):path}
function correctedRows(){return rows.flatMap(row=>[1,2].map(number=>{const prefix=`clip_${number}_`;return {original_audio_path:row.original_audio,corrected_transcript:row[prefix+'corrected_transcript']??row[prefix+'transcript'],audio_path:repositoryPath(row[prefix+'audio'])}}))}
function csvText(){const headers=['original_audio_path','corrected_transcript','audio_path'];const quote=value=>`"${String(value??'').replaceAll('"','""')}"`;return [headers.join(','),...correctedRows().map(row=>headers.map(header=>quote(row[header])).join(','))].join('\r\n')+'\r\n'}
function downloadCorrections(){const blob=new Blob([csvText()],{type:'text/csv;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='corrected_above30seconds.csv';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(link.href);$('save-status').textContent='Downloaded corrected_above30seconds.csv'}
async function saveCorrections(){const status=$('save-status');status.textContent='Saving…';try{const response=await fetch('save-corrections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:correctedRows()})});if(!response.ok)throw Error(`${response.status} ${response.statusText}`);const result=await response.json();status.textContent=`Saved ${result.row_count} rows to ${result.path}`}catch(error){downloadCorrections();status.textContent=`The static server cannot write files, so corrected_above30seconds.csv was downloaded instead (${error.message}).`}}
function initialise(){
  const previous=$('alignment-previous'),next=$('alignment-next'),position=$('alignment-position'),content=$('alignment-content'),save=$('save-corrections'),download=$('download-corrections');
  if(!previous||!next||!position||!content||!save||!download){throw new Error('Viewer controls were not found in the page DOM')}
  previous.addEventListener('click',()=>move(-1));
  next.addEventListener('click',()=>move(1));
  position.addEventListener('input',event=>{current=Number(event.target.value);show()});
  save.addEventListener('click',saveCorrections);
  download.addEventListener('click',downloadCorrections);
  fetch(dataUrl).then(response=>{if(!response.ok)throw Error(`${response.status} ${response.statusText}`);return response.text()}).then(text=>{rows=parseCsv(text);position.max=Math.max(rows.length-1,0);if(!rows.length)throw Error('The results CSV contains no records');restoreCorrections();show()}).catch(error=>content.innerHTML=`<p class="error">Could not load ${escapeHtml(dataUrl)}: ${escapeHtml(error.message)}</p>`);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initialise,{once:true})}else{initialise()}
</script></body></html>
