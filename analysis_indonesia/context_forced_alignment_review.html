<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Context forced-alignment review</title>
<style>
:root{--ink:#172326;--muted:#617270;--paper:#eef3f1;--panel:white;--line:#d4dfdc;--navy:#153e43;--core:#dff1ed;--before:#e8e1f6;--after:#fff0cc;--low:#cf5f43;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}header{background:var(--navy);color:white;padding:24px}.wrap{width:min(1400px,calc(100% - 28px));margin:auto}h1{margin:0 0 6px}header p{margin:0;color:#d4e6e4}.controls{display:flex;gap:14px;align-items:end;flex-wrap:wrap;padding:16px 0}.controls label{display:grid;gap:4px;color:var(--muted);font-size:.8rem;font-weight:700}.controls input,.controls select{padding:8px;border:1px solid var(--line);border-radius:7px;background:white}.layout{display:grid;grid-template-columns:340px 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}.list{height:76vh;overflow:auto;padding:7px}.record{display:block;width:100%;border:0;border-bottom:1px solid #e6ece9;background:white;padding:11px;text-align:left;cursor:pointer}.record[aria-current=true]{background:#dfeeea}.record small{color:var(--muted)}.detail{padding:20px;overflow:hidden}.detail audio{width:100%;margin:10px 0}.transcript{background:#f5f8f7;padding:13px;border-radius:7px;line-height:1.55}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}.transport{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;margin:5px 0 15px}.transport button{border:1px solid var(--line);background:white;border-radius:7px;padding:7px 10px;cursor:pointer}.transport input{width:100%}.playhead{min-width:105px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:42vh;overflow:auto;padding:4px}.word{border:1px solid #aebdb9;border-radius:7px;padding:7px 8px;cursor:pointer;text-align:left}.word.core{background:var(--core)}.word.before{background:var(--before)}.word.after{background:var(--after)}.word.low{border:2px solid var(--low)}.word.active{outline:3px solid #172326}.word small{display:block;color:var(--muted);font-size:.7rem}.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}.swatch{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-2px;border:1px solid #aaa;background:var(--colour)}.failed{color:var(--low);font-weight:700}@media(max-width:800px){.layout{grid-template-columns:1fr}.list{height:35vh}.transport{grid-template-columns:auto 1fr auto}.playhead{grid-column:1/-1;text-align:left}}
</style></head><body><header><div class="wrap"><h1>Context forced-alignment review</h1><p>Each clip is aligned with its nominal TSV rows plus two rows on either side. Context words with convincing probabilities may reveal transcript-boundary drift.</p></div></header>
<main class="wrap"><div class="controls"><label>Recording<select id="recording"><option value="all">All</option></select></label><label>Show<select id="status"><option value="all">All clips</option><option value="aligned">Aligned only</option><option value="failed">Failures only</option><option value="context">Strong context words</option></select></label><label>Low probability below<input id="threshold" type="number" min="0" max="1" step=".05" value=".20"></label><label>Search<input id="search" type="search" placeholder="word or transcript"></label><strong id="count"></strong></div><div class="layout"><aside class="panel list" id="list"></aside><section class="panel detail" id="detail"><p>Loading…</p></section></div></main>
<script>
const q=new URLSearchParams(location.search),dataUrl=new URL(q.get('data')||'../processed_indonesia/context_alignment_preview/context_alignment.json',location.href);let data,clips=[],active;
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),time=s=>`${Number(s).toFixed(3)}s`;
function strongContext(c){return c.words.some(w=>w.context!=='core'&&+w.probability>=+$('#threshold').value)}
function visible(){const recording=$('#recording').value,status=$('#status').value,term=$('#search').value.toLowerCase();return clips.filter(c=>(recording==='all'||c.recording===recording)&&(status==='all'||(status==='aligned'?c.alignment_status==='aligned':status==='failed'?c.alignment_status!=='aligned':strongContext(c)))&&(`${c.core_transcript} ${c.expanded_transcript} ${c.clip_id}`.toLowerCase().includes(term)))}
function render(){const rows=visible();if(!rows.includes(active))active=rows[0];$('#count').textContent=`${rows.length} clips`;$('#list').innerHTML=rows.map(c=>`<button class="record" data-id="${esc(c.clip_id)}" aria-current="${c===active}"><strong>${esc(c.clip_id)}</strong><br><small>${time(c.start_seconds)}–${time(c.end_seconds)} · ${c.alignment_status==='aligned'?Math.round(c.mean_probability*100)+'%':esc(c.alignment_status)}</small></button>`).join('')||'<p>No matching clips.</p>';document.querySelectorAll('.record').forEach(b=>b.onclick=()=>{active=clips.find(c=>c.clip_id===b.dataset.id);render()});detail()}
function detail(){if(!active){$('#detail').innerHTML='<p>No clip selected.</p>';return}const words=active.words||[],threshold=+$('#threshold').value,audioUrl=new URL(active.audio_path,dataUrl),duration=Number(active.duration_seconds);$('#detail').innerHTML=`<h2>${esc(active.clip_id)}</h2><div class="meta"><span>Source ${time(active.start_seconds)}–${time(active.end_seconds)}</span><span>${duration.toFixed(1)} seconds</span><span>${esc(active.cut_reason)}</span><span class="${active.alignment_status==='aligned'?'':'failed'}">${esc(active.alignment_status)}</span></div><audio id="audio" controls preload="metadata" src="${esc(audioUrl)}"></audio><div class="transport"><button id="backFive" type="button">−5 s</button><input id="scrubber" type="range" min="0" max="${duration}" step=".01" value="0" aria-label="Audio position"><button id="forwardFive" type="button">+5 s</button><strong class="playhead" id="playhead">0.000s / ${time(duration)}</strong></div><p>Core TSV rows: ${esc(active.core_row_numbers.join(', '))} · expanded rows: ${esc(active.expanded_row_numbers.join(', '))}</p><p class="transcript"><strong>Nominal clip transcript</strong><br>${esc(active.core_transcript)}</p><div class="legend"><span><i class="swatch" style="--colour:var(--core)"></i>Core row</span><span><i class="swatch" style="--colour:var(--before)"></i>Earlier context</span><span><i class="swatch" style="--colour:var(--after)"></i>Later context</span><span><i class="swatch" style="--colour:white;border:2px solid var(--low)"></i>Below probability threshold</span></div><div class="words">${words.length?words.map((w,i)=>`<button class="word ${w.context} ${+w.probability<threshold?'low':''}" data-index="${i}"><strong>${esc(w.word)}</strong><small>row ${w.row_number} · ${time(w.start_seconds)}–${time(w.end_seconds)} · ${(+w.probability*100).toFixed(1)}%</small></button>`).join(''):'<p class="failed">No word alignment was produced for this clip.</p>'}</div>`;const audio=$('#audio'),scrubber=$('#scrubber'),playhead=$('#playhead'),buttons=[...document.querySelectorAll('.word')];let scrubbing=false;function seek(seconds,autoplay=false){const apply=()=>{const target=Math.max(0,Math.min(Number(seconds)||0,Number.isFinite(audio.duration)?audio.duration:duration));audio.currentTime=target;scrubber.value=target;playhead.textContent=`${time(target)} / ${time(duration)}`;if(autoplay)audio.play().catch(()=>{})};if(audio.readyState>=HTMLMediaElement.HAVE_METADATA)apply();else audio.addEventListener('loadedmetadata',apply,{once:true})}buttons.forEach(b=>b.onclick=()=>seek(words[+b.dataset.index].start_seconds,true));scrubber.onpointerdown=()=>scrubbing=true;scrubber.onpointerup=()=>{scrubbing=false;seek(scrubber.value)};scrubber.oninput=()=>seek(scrubber.value);$('#backFive').onclick=()=>seek(audio.currentTime-5);$('#forwardFive').onclick=()=>seek(audio.currentTime+5);audio.ontimeupdate=()=>{if(!scrubbing)scrubber.value=audio.currentTime;playhead.textContent=`${time(audio.currentTime)} / ${time(duration)}`;buttons.forEach((b,i)=>b.classList.toggle('active',audio.currentTime>=words[i].start_seconds&&audio.currentTime<=words[i].end_seconds))}}
['recording','status','threshold','search'].forEach(id=>$('#'+id).oninput=render);fetch(dataUrl).then(r=>{if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}).then(payload=>{data=payload;clips=payload.clips;[...new Set(clips.map(c=>c.recording))].sort((a,b)=>+a-+b).forEach(r=>$('#recording').add(new Option(`Jember ${r}`,r)));render()}).catch(error=>$('#detail').innerHTML=`<p class="failed">Could not load ${esc(dataUrl)}: ${esc(error.message)}</p>`);
</script></body></html>
