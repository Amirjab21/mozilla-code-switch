<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audio perturbation comparison</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172326;background:#eef3f1;--navy:#173f43;--line:#d7e0de;--active:#dcecea;--muted:#657775}*{box-sizing:border-box}body{margin:0}header{background:var(--navy);color:#fff;padding:24px}.wrap{width:min(1400px,calc(100% - 28px));margin:auto}h1{margin:0 0 6px}header p{margin:0;color:#d8e8e6}.controls{display:flex;gap:12px;align-items:end;padding:18px 0;flex-wrap:wrap}.controls label{display:grid;gap:4px;color:var(--muted);font-size:.82rem}.controls input{min-width:320px}input,button{font:inherit;padding:9px;border:1px solid #aebcba;border-radius:7px;background:#fff}.count{margin-left:auto}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px #173f4310}.list{height:76vh;overflow:auto;padding:8px}.record{display:block;width:100%;text-align:left;padding:11px;border:0;border-bottom:1px solid #e6ecea;background:#fff;cursor:pointer}.record[aria-current=true]{background:var(--active)}.record small,.muted{color:var(--muted)}.detail{padding:22px;min-width:0}.nav{display:flex;justify-content:space-between;align-items:center}.transcript{font-size:1.08rem;line-height:1.55;background:#f5f8f7;padding:14px;border-radius:8px}.variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.variant{border:1px solid var(--line);border-radius:9px;padding:16px;min-width:0}.variant h3{margin:0 0 4px}.variant audio{width:100%;margin:12px 0}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:.75rem;padding:4px 8px;border-radius:99px;background:#e6ecea}.badge.noise{background:#fff0cf;color:#7c5100}.badge.speed{background:#e5e1ff;color:#4935a0}.badge.volume{background:#dff4df;color:#285f2b}.badge.reverb{background:#dceeff;color:#19547d}.badge.time{background:#ffe1e8;color:#8a2942}.path{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}.empty{color:#9a4f00}@media(max-width:900px){.layout{grid-template-columns:1fr}.list{height:30vh}.variants{grid-template-columns:1fr}.count{margin-left:0}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>Audio perturbation comparison</h1><p>Compare speed, pitch, random amplitude, time dropout, room reverb, and noise side by side.</p></div></header>
  <main class="wrap">
    <div class="controls"><label>Search<input id="search" type="search" placeholder="filename or transcript"></label><strong class="count" id="count"></strong></div>
    <div class="layout"><aside class="panel list" id="list"></aside><section class="panel detail" id="detail"><p>Loading comparison data…</p></section></div>
  </main>
  <script>
    const query=new URLSearchParams(location.search),dataUrl=new URL(query.get('data')||'../processed_indonesia/window_preview_noise/03_1_perturbation_review.csv',location.href);let rows=[],groups=[],active=null;const $=s=>document.querySelector(s),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function csv(text){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}const head=out.shift()||[];return out.map(values=>Object.fromEntries(head.map((key,i)=>[key,values[i]||''])))}
    function audioUrl(path){return new URL('../'+path.replace(/^\.\//,''),location.href)}
    function shown(){const n=$('#search').value.toLowerCase();return groups.filter(g=>(`${g.key} ${g.items[0]?.transcript||''}`).toLowerCase().includes(n))}
    function move(offset){const visible=shown(),i=visible.indexOf(active),next=visible[i+offset];if(next){active=next;render()}}
    function render(){const visible=shown();if(!visible.includes(active))active=visible[0]||null;$('#count').textContent=`${visible.length} source clips`;$('#list').innerHTML=visible.map(g=>`<button class="record" data-key="${esc(g.key)}" aria-current="${g===active}"><strong>${esc(g.key.split('/').pop())}</strong><br><small>${g.items.length} versions</small></button>`).join('')||'<p class="empty">No matching clips.</p>';document.querySelectorAll('.record').forEach(b=>b.onclick=()=>{active=groups.find(g=>g.key===b.dataset.key);render()});detail()}
    function signedDb(value){const number=Number(value);return Number.isFinite(number)?`${number>0?'+':''}${number.toFixed(2)} dB`:'unknown gain'}
    function detail(){if(!active){$('#detail').innerHTML='<p>No clip selected.</p>';return}const visible=shown(),position=visible.indexOf(active)+1;$('#detail').innerHTML=`<div class="nav"><button id="prev" ${position<=1?'disabled':''}>← Previous</button><strong>${position} / ${visible.length}</strong><button id="next" ${position>=visible.length?'disabled':''}>Next →</button></div><h2>${esc(active.key.split('/').pop())}</h2><p class="transcript">${esc(active.items[0]?.transcript)}</p><div class="variants">${active.items.map(item=>`<article class="variant"><h3>${esc(item.variant)}</h3><div class="badges">${item.noise_augmented==='true'?'<span class="badge noise">Noise</span>':''}${item.speed_augmented==='true'?`<span class="badge speed">Speed/pitch ${esc(item.speed_factor)}×</span>`:'<span class="badge">Original speed</span>'}${item.volume_augmented==='true'?`<span class="badge volume">Amplitude ${esc(signedDb(item.volume_gain_db))}</span>`:'<span class="badge">Original amplitude</span>'}${item.reverb_augmented==='true'?`<span class="badge reverb">Reverb ${esc(Math.round(Number(item.reverb_wet)*100))}% wet</span>`:'<span class="badge">No reverb</span>'}${item.time_dropout_augmented==='true'?`<span class="badge time">Time dropout ${esc(item.time_dropout_total_ms)} ms</span>`:'<span class="badge">No time dropout</span>'}</div><audio controls preload="metadata" src="${esc(audioUrl(item.audio_path))}"></audio><div class="path">${esc(item.audio_path)}</div>${item.noise_source?`<div class="path">Noise: ${esc(item.noise_source.split('/').pop())}</div>`:''}${item.reverb_rir?`<div class="path">RIR: ${esc(item.reverb_rir.split('/').pop())}</div>`:''}</article>`).join('')}</div>`;$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1)}
    $('#search').oninput=render;document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});fetch(dataUrl).then(r=>{if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.text()}).then(text=>{rows=csv(text);const map=new Map;for(const row of rows){if(!map.has(row.comparison_group))map.set(row.comparison_group,[]);map.get(row.comparison_group).push(row)}groups=[...map].map(([key,items])=>({key,items}));render()}).catch(error=>$('#detail').innerHTML=`<p class="empty">Could not load ${esc(dataUrl)}: ${esc(error.message)}</p>`);
  </script>
</body>
</html>
