<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clip-start word matching</title>
<style>
:root{--ink:#182426;--muted:#617270;--paper:#eef3f1;--panel:#fff;--line:#d4dfdc;--navy:#153e43;--match:#dff1e9;--pred:#e9e2f5;--nominal:#fff0cc;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}header{background:var(--navy);color:#fff;padding:24px}.wrap{width:min(1300px,calc(100% - 28px));margin:auto}h1{margin:0 0 6px}header p{margin:0;color:#d5e6e4}.controls{display:flex;gap:12px;padding:16px 0;align-items:end}.controls label{display:grid;gap:4px;color:var(--muted);font-size:.8rem}.controls input{padding:8px;border:1px solid var(--line);border-radius:7px}.layout{display:grid;grid-template-columns:320px 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}.list{height:78vh;overflow:auto;padding:7px}.record{width:100%;display:block;border:0;border-bottom:1px solid #e5ebe9;background:white;text-align:left;padding:11px;cursor:pointer}.record[aria-current=true]{background:#dfeeea}.record small,.muted{color:var(--muted)}.detail{padding:20px}.detail audio{width:100%;margin:10px 0}.transport{display:grid;grid-template-columns:auto 1fr auto;gap:8px}.transport input{width:100%}.transport button{border:1px solid var(--line);border-radius:7px;background:white}.box{padding:12px;border-radius:8px;margin:10px 0;line-height:1.5}.full{background:#eaf3ff}.predicted{background:var(--pred)}.nominal{background:var(--nominal)}.matched{background:var(--match)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}tr.selected{background:var(--match)}.distance{font-variant-numeric:tabular-nums}.pill{padding:3px 7px;border-radius:999px;background:#337b65;color:white;font-size:.7rem;font-weight:800}@media(max-width:760px){.layout{grid-template-columns:1fr}.list{height:32vh}}
</style></head><body><header><div class="wrap"><h1>Clip-start phrase matching</h1><p>Match the first consecutive Wav2Vec2 words against nearby phrases from the previous, nominal, and following TSV rows.</p></div></header><main class="wrap"><div class="controls"><label>Search<input id="search" type="search" placeholder="clip, predicted or matched phrase"></label><strong id="count"></strong></div><div class="layout"><aside class="panel list" id="list"></aside><section class="panel detail" id="detail">Loading…</section></div></main>
<script>
const q=new URLSearchParams(location.search),dataUrl=new URL(q.get('data')||'../processed_indonesia/context_alignment_preview/clip_start_matches.json',location.href);let clips=[],active;const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),distance=n=>n==null?'—':Number(n).toFixed(3),seconds=n=>Number(n).toFixed(3)+'s';
function visible(){const term=$('#search').value.toLowerCase();return clips.filter(c=>(`${c.clip_id} ${c.predicted_transcript} ${c.matched_word?.phrase||''} ${c.nominal_transcript} ${c.full_transcript||''}`.toLowerCase().includes(term)))}
function render(){const rows=visible();if(!rows.includes(active))active=rows[0];$('#count').textContent=`${rows.length} clips`;$('#list').innerHTML=rows.map(c=>`<button class="record" data-id="${esc(c.clip_id)}" aria-current="${c===active}"><strong>${esc(c.clip_id)}</strong><br><small>${esc(c.predicted_start_phrase||'empty')} → ${esc(c.matched_word?.phrase||'no match')} · ${distance(c.matched_word?.distance)}</small></button>`).join('')||'<p>No matches.</p>';document.querySelectorAll('.record').forEach(b=>b.onclick=()=>{active=clips.find(c=>c.clip_id===b.dataset.id);render()});detail()}
function detail(){if(!active){$('#detail').innerHTML='<p>No clip selected.</p>';return}const audioUrl=new URL(active.audio_path,dataUrl),selected=active.matched_word;$('#detail').innerHTML=`<h2>${esc(active.clip_id)}</h2><audio id="audio" controls preload="metadata" src="${esc(audioUrl)}"></audio><div class="transport"><button id="restart">Restart</button><input id="scrubber" aria-label="Audio position" type="range" min="0" max="${active.clip_duration_seconds}" step=".01" value="0"><strong id="playhead">0.000s</strong></div><p class="muted">Only the first ${active.audio_transcribed_seconds}s was transcribed for matching.</p><div class="box full"><strong>Full transcript attached to this clip</strong><br>${esc(active.full_transcript||active.nominal_transcript)}</div><div class="box predicted"><strong>Wav2Vec2 prediction of the opening audio</strong><br>${esc(active.predicted_transcript)}<br><span class="pill">Opening phrase: ${esc(active.predicted_start_phrase||'empty')}</span></div><div class="box nominal"><strong>Nominal starting TSV row ${active.nominal_row_number}</strong><br>${esc(active.nominal_transcript)}</div><div class="box matched"><strong>Selected phrase: ${esc(selected?.phrase||'none')}</strong> · ${esc(active.closeness_metric)} distance ${distance(selected?.distance)}<br><strong>Selected first word: ${esc(selected?.word||'none')}</strong><br><strong>Corrected full transcript (through TSV row ${active.final_row_number??'—'})</strong><br>${esc(active.corrected_starting_transcript)}</div><h3>All nearby TSV phrases tested</h3><table><thead><tr><th>Phrase</th><th>Location</th><th>Row</th><th>Offset</th><th>Distance</th><th>Edit distance</th></tr></thead><tbody>${active.candidate_words.map(c=>`<tr class="${selected&&c.row_number===selected.row_number&&c.word_index===selected.word_index?'selected':''}"><td><strong>${esc(c.phrase)}</strong></td><td>${esc(c.location.replace('_',' '))}</td><td>${c.row_number}</td><td>${c.boundary_offset}</td><td class="distance">${distance(c.distance)}</td><td>${c.metric_details.edit_distance??'—'}</td></tr>`).join('')}</tbody></table>`;const audio=$('#audio'),scrubber=$('#scrubber'),playhead=$('#playhead');function seek(value,play=false){const apply=()=>{audio.currentTime=Math.max(0,Math.min(+value,audio.duration||active.clip_duration_seconds));scrubber.value=audio.currentTime;playhead.textContent=seconds(audio.currentTime);if(play)audio.play()};audio.readyState>=1?apply():audio.addEventListener('loadedmetadata',apply,{once:true})}$('#restart').onclick=()=>seek(0,true);scrubber.oninput=()=>seek(scrubber.value);audio.ontimeupdate=()=>{scrubber.value=audio.currentTime;playhead.textContent=seconds(audio.currentTime)}}
$('#search').oninput=render;fetch(dataUrl).then(r=>{if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}).then(data=>{clips=data.clips;render()}).catch(error=>$('#detail').innerHTML=`<p>Could not load matches: ${esc(error.message)}</p>`);
</script></body></html>
