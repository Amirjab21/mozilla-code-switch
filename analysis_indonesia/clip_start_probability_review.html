<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clip-start probability review</title>
<style>
:root{--ink:#182426;--muted:#637270;--paper:#eef3f1;--panel:#fff;--line:#d5dfdc;--navy:#153e43;--best:#dff1e9;--base:#fff0cc;--low:#cf6247;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}header{background:var(--navy);color:white;padding:24px}.wrap{width:min(1400px,calc(100% - 28px));margin:auto}h1{margin:0 0 6px}header p{margin:0;color:#d5e6e4}.controls{display:flex;gap:12px;align-items:end;padding:16px 0;flex-wrap:wrap}.controls label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}input,select{padding:8px;border:1px solid var(--line);border-radius:7px;background:white}.layout{display:grid;grid-template-columns:320px 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}.list{height:78vh;overflow:auto;padding:7px}.record{display:block;width:100%;padding:10px;border:0;border-bottom:1px solid #e5ebe9;background:white;text-align:left;cursor:pointer}.record[aria-current=true]{background:#dfeeea}.record small{color:var(--muted)}.detail{padding:20px}.detail audio{width:100%;margin:10px 0}.transport{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.transport button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:white}.transport input{width:100%}.nominal,.winner{padding:12px;border-radius:8px;line-height:1.5}.nominal{background:var(--base)}.winner{background:var(--best)}.sticker{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:999px;background:#7142a3;color:white;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.candidate{border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}.candidate summary{cursor:pointer;padding:12px;display:flex;justify-content:space-between;gap:12px}.candidate.best{border:2px solid #3b9271}.candidate.baseline summary{background:#fff9e9}.candidate-body{padding:0 12px 12px}.words{display:flex;flex-wrap:wrap;gap:6px}.word{border:1px solid #aebcb9;background:#f7f9f8;border-radius:6px;padding:6px 8px;cursor:pointer}.word.low{border:2px solid var(--low)}.word small{display:block;color:var(--muted);font-size:.7rem}.score{font-variant-numeric:tabular-nums;white-space:nowrap}.muted{color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.list{height:32vh}}
</style></head><body><header><div class="wrap"><h1>Clip-start probability review</h1><p>Compare fixed-length starting hypotheses against only the first five seconds of each clip.</p></div></header>
<main class="wrap"><div class="controls"><label>Search<input id="search" type="search" placeholder="clip or transcript"></label><label>Winner<select id="winner"><option value="all">All operations</option><option value="baseline">Baseline</option><option value="prepend">Previous words added</option><option value="drop">Opening words dropped</option></select></label><label>Low word probability below<input id="threshold" type="number" min="0" max="1" step=".05" value=".2"></label><strong id="count"></strong></div><div class="layout"><aside class="panel list" id="list"></aside><section class="panel detail" id="detail">Loading…</section></div></main>
<script>
const q=new URLSearchParams(location.search),dataUrl=new URL(q.get('data')||'../processed_indonesia/context_alignment_preview/start_sequence_scores.json',location.href);let clips=[],active;const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=n=>n==null?'failed':(n*100).toFixed(2)+'%',prob=n=>n==null?'failed':n<.001?n.toExponential(3):n.toFixed(6),sec=n=>Number(n).toFixed(3)+'s';
function visible(){const term=$('#search').value.toLowerCase(),winner=$('#winner').value;return clips.filter(c=>(winner==='all'||c.best_operation===winner||c.best_operation.startsWith(winner+'_'))&&(`${c.clip_id} ${c.nominal_transcript} ${c.best_sequence}`.toLowerCase().includes(term)))}
function render(){const rows=visible();if(!rows.includes(active))active=rows[0];$('#count').textContent=`${rows.length} clips`;$('#list').innerHTML=rows.map(c=>`<button class="record" data-id="${esc(c.clip_id)}" aria-current="${c===active}"><strong>${esc(c.clip_id)}</strong><br><small>${esc(c.best_operation)} · joint P ${prob(c.best_score)}</small></button>`).join('')||'<p>No matching clips.</p>';document.querySelectorAll('.record').forEach(b=>b.onclick=()=>{active=clips.find(c=>c.clip_id===b.dataset.id);render()});detail()}
function detail(){if(!active){$('#detail').innerHTML='<p>No clip selected.</p>';return}const audioUrl=new URL(active.audio_path,dataUrl),threshold=+$('#threshold').value,firstWordSelected=active.selection_method==='first_word_probability';$('#detail').innerHTML=`<h2>${esc(active.clip_id)}</h2><audio id="audio" controls preload="metadata" src="${esc(audioUrl)}"></audio><div class="transport"><button id="restart">Restart</button><input id="scrubber" aria-label="Audio position" type="range" min="0" max="${active.clip_duration_seconds}" step=".01" value="0"><strong id="playhead">0.000s</strong></div><p class="muted">Only the first ${active.audio_scored_seconds}s was used for scoring. The player contains the entire clip.</p><p class="nominal"><strong>TSV row ${active.current_row_number} nominal start</strong><br>${esc(active.nominal_transcript)}</p><p class="winner"><strong>Selected start · ${esc(active.best_operation)} · joint P ${prob(active.best_score)} · first word ${pct(active.best_first_word_probability)}</strong>${firstWordSelected?'<span class="sticker">Selected for first word</span>':''}<br>${esc(active.best_sequence)}</p><p class="muted">Highest joint-probability candidate: ${esc(active.joint_best_operation)} · ${prob(active.joint_best_score)}. Close-score set: ${esc((active.close_score_operations||[]).join(', '))}.</p><h3>All tested sequences</h3>${active.candidates.map(c=>{const selected=c.operation===active.best_operation;return `<details class="candidate ${selected?'best':''} ${c.operation==='baseline'?'baseline':''}" ${selected?'open':''}><summary><span><strong>${esc(c.operation)}</strong> · ${esc(c.description)} ${selected&&firstWordSelected?'<span class="sticker">Selected for first word</span>':''}</span><span class="score">joint P ${prob(c.score)} · first word ${pct(c.first_word_probability)}</span></summary><div class="candidate-body"><p>${esc(c.sequence)}</p><p class="muted">Normalized token probability ${pct(c.normalized_token_probability)} · total token log P ${c.total_token_log_probability==null?'failed':c.total_token_log_probability.toFixed(2)}</p><div class="words">${c.words.map(w=>`<button class="word ${w.probability<threshold?'low':''}" data-time="${w.start_seconds}"><strong>${esc(w.word)}</strong><small>${pct(w.probability)} · ${sec(w.start_seconds)}–${sec(w.end_seconds)}</small></button>`).join('')}</div></div></details>`}).join('')}`;const audio=$('#audio'),scrubber=$('#scrubber'),playhead=$('#playhead');function seek(value,play=false){const apply=()=>{audio.currentTime=Math.max(0,Math.min(+value,audio.duration||active.clip_duration_seconds));scrubber.value=audio.currentTime;playhead.textContent=sec(audio.currentTime);if(play)audio.play()};audio.readyState>=1?apply():audio.addEventListener('loadedmetadata',apply,{once:true})}$('#restart').onclick=()=>seek(0,true);scrubber.oninput=()=>seek(scrubber.value);document.querySelectorAll('.word').forEach(w=>w.onclick=()=>seek(w.dataset.time,true));audio.ontimeupdate=()=>{scrubber.value=audio.currentTime;playhead.textContent=sec(audio.currentTime)}}
['search','winner','threshold'].forEach(id=>$('#'+id).oninput=render);fetch(dataUrl).then(r=>{if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}).then(data=>{clips=data.clips;render()}).catch(error=>$('#detail').innerHTML=`<p>Could not load results: ${esc(error.message)}</p>`);
</script></body></html>
