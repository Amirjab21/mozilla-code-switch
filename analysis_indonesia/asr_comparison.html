<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASR model comparison</title>
  <style>
    :root { --ink:#142631; --muted:#63727b; --paper:#f7f5ef; --panel:#fff; --line:#d7e0e2; --navy:#123d52; --good:#dff3df; --bad:#fde3e1; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 system-ui,sans-serif; }
    header { background:var(--navy); color:#fff; padding:2.6rem 1.25rem 2rem; } .wrap { width:min(1280px,calc(100% - 2rem)); margin:auto; }
    h1 { margin:0; font-size:clamp(2rem,5vw,3rem); letter-spacing:-.04em; } header p { margin:.7rem 0 0; color:#d6e6e8; }
    main { padding:1.5rem 0 4rem; } .controls { display:flex; gap:.8rem; flex-wrap:wrap; margin-bottom:1rem; } input,select,button { padding:.7rem .8rem; border:1px solid var(--line); border-radius:.45rem; font:inherit; background:#fff; } button { cursor:pointer; } button:disabled { cursor:wait; opacity:.65; }
    .layout { display:grid; grid-template-columns:310px minmax(0,1fr); gap:1rem; } .panel { background:var(--panel); border:1px solid var(--line); border-radius:.7rem; overflow:hidden; }
    .records { max-height:70vh; overflow:auto; } .record { display:block; width:100%; padding:.8rem 1rem; border:0; border-bottom:1px solid #edf0f1; background:#fff; color:inherit; text-align:left; cursor:pointer; } .record[aria-current=true] { background:#e4f2f0; }
    .muted { color:var(--muted); } .detail { padding:1.25rem; } .audio { width:100%; margin:.8rem 0; } .reference { padding:.8rem; border-radius:.45rem; background:#f2f5f5; }
    .models { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem; } .model { border:1px solid var(--line); border-radius:.55rem; padding:1rem; } h2,h3 { margin:0; } h2 { font-size:1.25rem; } h3 { font-size:1rem; }
    .wer { margin:.35rem 0 .75rem; color:var(--muted); } .transcript { min-height:4.4rem; margin:0; } .alignment { margin-top:.85rem; line-height:2.25; } .token { display:inline-block; margin:2px; padding:2px 5px; border-radius:3px; } .ok { background:var(--good); color:#17602b; } .bad { background:var(--bad); color:#8b251c; } .insert { border:1px dashed #b94a3b; }
    .empty { padding:2rem; color:var(--muted); text-align:center; } @media (max-width:850px) { .layout,.models { grid-template-columns:1fr; } .records { max-height:250px; } }
  </style>
</head>
<body>
  <header><div class="wrap"><h1>ASR model comparison</h1><p>Compare Whisper Small, Whisper Large, and Indonesian/Javanese Wav2Vec2 output on the same approved clip.</p></div></header>
  <main class="wrap">
    <div class="controls"><label>Search <input id="search" type="search" placeholder="Filename or transcript"></label><label>Sort <select id="sort"><option value="difference">Largest WER difference</option><option value="whisper">Worst Whisper WER</option><option value="wav2vec2">Worst Wav2Vec2 WER</option></select></label><label>Fresh transcription <select id="transcribeModel"><option value="small">Whisper Small</option><option value="medium">Whisper Medium</option><option value="large">Whisper Large</option><option value="wav2vec2-indonesian-javanese-sundanese">Indonesian/Javanese Wav2Vec2</option></select></label><button id="transcribe" type="button">Transcribe selected clip</button><span id="transcriptionStatus" class="muted"></span></div>
    <div class="layout"><aside class="panel"><div id="records" class="records"><p class="empty">Loading results…</p></div></aside><section id="detail" class="panel detail"><p class="empty">Loading results…</p></section></div>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const configUrl = new URL(query.get('config') || '../processed_indonesia/dataset.json', location.href);
    const $ = selector => document.querySelector(selector);
    const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const json = value => { try { return JSON.parse(value || '[]'); } catch { return []; } };
    const parseCsv = text => { const output=[]; let row=[], field='', quoted=false; for(let i=0;i<text.length;i++){ const char=text[i], next=text[i+1]; if(char==='"'&&quoted&&next==='"'){field+='"';i++;}else if(char==='"'){quoted=!quoted;}else if(char===','&&!quoted){row.push(field);field='';}else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')i++;row.push(field);if(row.some(Boolean))output.push(row);row=[];field='';}else field+=char;}if(field||row.length){row.push(field);output.push(row);}const [headers,...values]=output;return values.map(value=>Object.fromEntries(headers.map((header,index)=>[header,value[index]??'']))); };
    const alignment = items => items.map(item => item.operation==='correct' ? `<span class="token ok">${escape(item.reference)}</span>` : `<span class="token bad ${item.operation==='insertion'?'insert':''}">${item.operation==='insertion'?`+ ${escape(item.hypothesis)}`:item.operation==='deletion'?`− ${escape(item.reference)}`:`${escape(item.reference)} → ${escape(item.hypothesis)}`}</span>`).join('');
    let rows=[], active, audioDir;
    const clip = row => row.audio_path.split('/').pop();
    const visible = () => { const term=$('#search').value.trim().toLowerCase(), sort=$('#sort').value; return rows.filter(row => `${clip(row.whisper)} ${row.whisper.transcript}`.toLowerCase().includes(term)).sort((a,b) => { const aw=Number(a.whisper.wer), bw=Number(b.whisper.wer), aa=Number(a.wav2vec2.wer), ba=Number(b.wav2vec2.wer); return sort==='whisper' ? bw-aw : sort==='wav2vec2' ? ba-aa : Math.abs(bw-ba)-Math.abs(aw-aa); }); };
    function render() { const items=visible(); if(!items.includes(active)) active=items[0]; $('#records').innerHTML=items.length ? items.map(item => `<button class="record" data-id="${rows.indexOf(item)}" aria-current="${item===active}"><strong>${escape(clip(item.whisper))}</strong><br><span class="muted">Small ${(100*Number(item.whisper.wer)).toFixed(1)}% · Large ${(100*Number(item.large.wer)).toFixed(1)}% · Wav2Vec2 ${(100*Number(item.wav2vec2.wer)).toFixed(1)}%</span></button>`).join('') : '<p class="empty">No matching clips.</p>'; detail(); }
    function detail() { if(!active){$('#detail').innerHTML='<p class="empty">Choose a clip to inspect it.</p>';return;} const {whisper,large,wav2vec2}=active, src=new URL(clip(whisper),audioDir).href; $('#detail').innerHTML=`<h2>${escape(clip(whisper))}</h2><audio class="audio" controls src="${escape(src)}"></audio><div class="reference"><strong>Reference</strong><br>${escape(whisper.transcript)}</div><p><strong>Fresh transcription</strong><br><span id="onDemandTranscript" class="muted">Choose a model above and transcribe this clip.</span></p><div class="models"><article class="model"><h3>Whisper Small</h3><p class="wer">WER: ${(100*Number(whisper.wer)).toFixed(2)}%</p><p class="transcript">${escape(whisper.whisper_transcript)}</p><div class="alignment">${alignment(json(whisper.alignment))}</div></article><article class="model"><h3>Whisper Large</h3><p class="wer">WER: ${(100*Number(large.wer)).toFixed(2)}%</p><p class="transcript">${escape(large.whisper_transcript)}</p><div class="alignment">${alignment(json(large.alignment))}</div></article><article class="model"><h3>Indonesian/Javanese Wav2Vec2</h3><p class="wer">WER: ${(100*Number(wav2vec2.wer)).toFixed(2)}%</p><p class="transcript">${escape(wav2vec2.asr_transcript)}</p><div class="alignment">${alignment(json(wav2vec2.alignment))}</div></article></div>`; }
    $('#records').addEventListener('click', event => { const item=event.target.closest('.record'); if(item){active=rows[Number(item.dataset.id)];render();} }); $('#search').addEventListener('input',render); $('#sort').addEventListener('change',render);
    $('#transcribe').addEventListener('click', async () => { if(!active)return; const button=$('#transcribe'),status=$('#transcriptionStatus'),model=$('#transcribeModel').value; button.disabled=true;status.className='muted';status.textContent='Transcribing… the first use of a model may load its checkpoint.';try { const response=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio_path:active.whisper.audio_path,model})}); const result=await response.json();if(!response.ok)throw Error(result.error||`${response.status} ${response.statusText}`);const transcript=$('#onDemandTranscript');if(transcript)transcript.textContent=result.transcript ? `“${result.transcript}”` : '∅ (the model returned an empty transcript)';status.textContent=`Completed with ${result.engine} on ${result.device} (${result.transcript.length} characters).`; } catch(error) { status.className='empty';status.textContent=`Transcription failed: ${error.message}. Start or restart processing/06_huggingface_whisper_server.py.`; } finally { button.disabled=false; } });
    fetch(configUrl).then(response=>response.json()).then(config=>{ audioDir=new URL(config.paths.vad_audio_dir.replace(/\/?$/, '/'),configUrl); const whisperUrl=new URL(query.get('whisper_csv') || config.paths.whisper_evaluation,configUrl); const largeUrl=new URL(query.get('large_csv') || '04_whisper_large_evaluation.csv',configUrl); const wavUrl=new URL(query.get('wav2vec2_csv') || '04_wav2vec2_evaluation.csv',configUrl); return Promise.all([fetch(whisperUrl),fetch(largeUrl),fetch(wavUrl)]); }).then(async responses=>{if(responses.some(response=>!response.ok))throw Error('One or more evaluation CSV files could not be loaded. Run Whisper Large first.'); const [whisper,large,wav2vec2]=await Promise.all(responses.map(response=>response.text())); const largeByClip=new Map(parseCsv(large).map(row=>[clip(row),row])), wavByClip=new Map(parseCsv(wav2vec2).map(row=>[clip(row),row])); rows=parseCsv(whisper).map(row=>({whisper:row,large:largeByClip.get(clip(row)),wav2vec2:wavByClip.get(clip(row))})).filter(row=>row.large&&row.wav2vec2); render(); }).catch(error=>{$('#records').innerHTML='';$('#detail').innerHTML=`<p class="empty">${escape(error.message)}</p>`;});
  </script>
</body>
</html>
