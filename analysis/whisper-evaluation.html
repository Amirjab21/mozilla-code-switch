<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whisper evaluation</title><style>
body{margin:0;background:#f7f5ef;color:#142631;font:15px/1.45 system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}header{background:#123d52;color:#fff}h1{margin:0;font-size:2rem}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}select,input{padding:8px;border:1px solid #cbd5d9;border-radius:5px;font:inherit}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}.panel{background:#fff;border:1px solid #d7e0e2;border-radius:8px}.summary{padding:14px}.summary table,.stats{width:100%;border-collapse:collapse}.summary td,.summary th,.stats td,.stats th{padding:5px;text-align:left;border-bottom:1px solid #edf0f1}.records{max-height:70vh;overflow:auto}.record{display:block;width:100%;padding:10px;border:0;border-bottom:1px solid #edf0f1;background:#fff;text-align:left;cursor:pointer}.record[aria-current=true]{background:#e4f2f0}.muted{color:#63727b}.detail{padding:18px}.diff{line-height:2.3}.token{display:inline-block;margin:2px;padding:2px 5px;border-radius:3px}.ok{background:#dff3df;color:#17602b}.bad{background:#fde3e1;color:#8b251c}.insert{border:1px dashed #b94a3b}.audio{width:100%}.error{padding:30px;color:#8b251c}@media(max-width:750px){.grid{grid-template-columns:1fr}.records{max-height:260px}}
</style></head><body><header><div class="wrap"><h1>Whisper transcription evaluation</h1><div class="muted" style="color:#d6e6e8">Clip WER, language-group WER, and aligned transcript differences</div></div></header><main class="wrap"><div class="controls"><label>Sort <select id="sort"><option value="wer-desc">Highest WER</option><option value="wer-asc">Lowest WER</option><option value="lang-desc">Highest language share</option><option value="lang-asc">Lowest language share</option></select></label><label>Language <select id="lang"></select></label><label>Search <input id="search" placeholder="filename or transcript"></label></div><section class="panel summary"><strong id="headline">Loading…</strong><table id="aggregate"></table></section><div class="grid"><aside class="panel"><div id="records" class="records"></div></aside><section class="panel detail" id="detail"></section></div></main><script>
const q=new URLSearchParams(location.search),configUrl=new URL(q.get('config')||'../dataset.json',location.href);let rows=[],active,config,audioDir;const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function json(v,f){try{return JSON.parse(v||'{}')}catch{return f}}
function stats(items){const out={reference_words:0,substitutions:0,deletions:0,insertions:0};for(const x of items){const g=json(x.wer_by_langid,{});for(const [k,v]of Object.entries(g)){out[k]??={reference_words:0,substitutions:0,deletions:0,insertions:0};for(const n of ['reference_words','substitutions','deletions','insertions'])out[k][n]+=v[n]||0;for(const n of ['reference_words','substitutions','deletions','insertions'])out[n]+=v[n]||0}}out.wer=(out.substitutions+out.deletions+out.insertions)/(out.reference_words||1);for(const [k,v]of Object.entries(out))if(typeof v==='object')v.wer=(v.substitutions+v.deletions+v.insertions)/(v.reference_words||1);return out}
function share(r,l){const x=json(r.wer_by_langid,{}),n=Object.values(x).reduce((a,v)=>a+(v.reference_words||0),0);return n?(x[l]?.reference_words||0)/n:0}
function visible(){const term=$('#search').value.toLowerCase(),[metric,dir]=$('#sort').value.split('-'),l=$('#lang').value;return rows.filter(r=>`${r.audio_path} ${r.transcript}`.toLowerCase().includes(term)).sort((a,b)=>{const av=metric==='wer'?+a.wer:share(a,l),bv=metric==='wer'?+b.wer:share(b,l);return dir==='desc'?bv-av:av-bv})}
function render(){const v=visible();if(!v.includes(active))active=v[0];const s=stats(v);$('#headline').textContent=`${v.length} clips · aggregate WER ${(s.wer*100).toFixed(1)}%`;$('#aggregate').innerHTML='<tr><th>Language ID</th><th>Words</th><th>WER</th></tr>'+Object.entries(s).filter(([,x])=>typeof x==='object').map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.reference_words}</td><td>${(x.wer*100).toFixed(1)}%</td></tr>`).join('');$('#records').innerHTML=v.map(r=>`<button class="record" data-id="${rows.indexOf(r)}" aria-current="${r===active}"><b>${esc(r.audio_path.split('/').pop())}</b><br><span class="muted">WER ${(100*+r.wer).toFixed(1)}% · ${esc(r.reference_dominant_language)}</span></button>`).join('');detail()}
function detail(){if(!active){$('#detail').innerHTML='<p class="error">No matching clips.</p>';return}const a=json(active.alignment,[]),g=json(active.wer_by_langid,{}),src=new URL(active.audio_path.split('/').pop(),audioDir).href;$('#detail').innerHTML=`<h2>${esc(active.audio_path.split('/').pop())} — WER ${(100*+active.wer).toFixed(1)}%</h2><audio class="audio" controls src="${esc(src)}"></audio><p><b>Reference:</b> ${esc(active.transcript)}</p><p><b>Whisper:</b> ${esc(active.whisper_transcript)}</p><h3>Alignment</h3><div class="diff">${a.map(x=>x.operation==='correct'?`<span class="token ok" title="${esc(x.langid)}">${esc(x.reference)}</span>`:`<span class="token bad ${x.operation==='insertion'?'insert':''}" title="${esc(x.langid)}">${x.operation==='insertion'?`+ ${esc(x.hypothesis)}`:x.operation==='deletion'?`− ${esc(x.reference)}`:`${esc(x.reference)} → ${esc(x.hypothesis)}`}</span>`).join('')}</div><h3>WER by language ID</h3><table class="stats"><tr><th>ID</th><th>Words</th><th>WER</th></tr>${Object.entries(g).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.reference_words}</td><td>${(100*x.wer).toFixed(1)}%</td></tr>`).join('')}</table>`}
$('#records').addEventListener('click',e=>{const b=e.target.closest('.record');if(b){active=rows[+b.dataset.id];render()}});$('#sort').addEventListener('change',render);$('#lang').addEventListener('change',render);$('#search').addEventListener('input',render);
fetch(configUrl).then(r=>r.json()).then(c=>{config=c;audioDir=new URL(config.paths.vad_audio_dir.replace(/\/?$/,'/'),configUrl);return fetch(new URL(config.paths.whisper_evaluation,configUrl))}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{const lines=t.trim().split(/\r?\n/),head=lines.shift().split(',');function csv(line){let a=[],f='',q=false;for(let i=0;i<line.length;i++){if(line[i]==='"'){if(q&&line[i+1]==='"'){f+='"';i++}else q=!q}else if(line[i]===','&&!q){a.push(f);f=''}else f+=line[i]}a.push(f);return a}rows=lines.map(x=>Object.fromEntries(head.map((h,i)=>[h,csv(x)[i]||''])));const ids=[...new Set(rows.flatMap(r=>Object.keys(json(r.wer_by_langid,{}))))].sort();$('#lang').innerHTML=ids.map(x=>`<option>${esc(x)}</option>`).join('');render()}).catch(()=>$('#detail').innerHTML='<p class="error">Evaluation CSV not found. Run Step 4 first.</p>');
</script></body></html>
