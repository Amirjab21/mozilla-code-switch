<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miami Corpus — Processed Audio Analysis</title>
  <style>
    :root { --ink:#10232e; --muted:#64737c; --paper:#f7f5ef; --panel:#fff; --line:#d8e0e2; --accent:#d85a38; --aqua:#0b7778; --navy:#123d52; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { background:var(--navy); color:#fff; padding:3.3rem 1.25rem 2.3rem; } .wrap { width:min(1180px,calc(100% - 2rem)); margin:auto; }
    .eyebrow { color:#9ddbd7; text-transform:uppercase; letter-spacing:.12em; font-size:.75rem; font-weight:800; margin:0 0 .45rem; } h1 { margin:0; font-size:clamp(2rem,5vw,3.6rem); letter-spacing:-.04em; line-height:1.08; } header p:last-child { max-width:720px; color:#d7e6e6; margin:1rem 0 0; }
    main { padding:1.6rem 0 4rem; } .filters { display:grid; grid-template-columns:1fr 210px; gap:.85rem; margin-bottom:1.25rem; } label { display:grid; gap:.32rem; color:var(--muted); font-size:.78rem; font-weight:750; letter-spacing:.04em; text-transform:uppercase; }
    input,select { min-width:0; padding:.72rem .8rem; border:1px solid var(--line); border-radius:.45rem; font:400 1rem system-ui,sans-serif; color:var(--ink); background:#fff; text-transform:none; letter-spacing:normal; } .layout { display:grid; grid-template-columns:310px minmax(0,1fr); gap:1.25rem; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:.7rem; overflow:hidden; box-shadow:0 3px 16px #142b3509; } .list-head { display:flex; justify-content:space-between; padding:.9rem 1rem; border-bottom:1px solid var(--line); font-size:.85rem; color:var(--muted); } .records { height:67vh; overflow:auto; }
    button.record { display:block; width:100%; padding:.8rem 1rem; border:0; border-bottom:1px solid #edf0f1; background:#fff; text-align:left; color:var(--ink); cursor:pointer; } button.record:hover,button.record[aria-current="true"] { background:#e6f3f2; } .record-name { display:block; font-weight:750; font-size:.9rem; } .record-sub { display:block; color:var(--muted); font-size:.77rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .status { color:var(--aqua); font-size:.75rem; font-weight:800; }
    .detail { padding:1.35rem; } .detail-top { display:flex; align-items:start; justify-content:space-between; gap:1rem; } h2 { margin:0; font-size:1.35rem; letter-spacing:-.02em; } .badge { border-radius:99px; background:#e6f3f2; color:#126467; padding:.2rem .55rem; font-size:.75rem; font-weight:800; white-space:nowrap; } .badge.out { color:#933c25; background:#fde9e3; }
    audio { width:100%; margin:1.25rem 0 .9rem; } canvas { width:100%; height:205px; display:block; background:#f4f7f6; border:1px solid var(--line); border-radius:.45rem; cursor:crosshair; } .wave-note { margin:.35rem 0 1.3rem; color:var(--muted); font-size:.82rem; } .meta { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin:0 0 1.35rem; } dt { color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; } dd { margin:.13rem 0 0; font-size:.92rem; overflow-wrap:anywhere; } .transcript-label { color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; } .transcript { margin:.35rem 0 0; font-size:1.08rem; line-height:2.1; } .token { display:inline-flex; align-items:baseline; gap:.18rem; margin:0 .22rem .3rem 0; padding:.05rem .28rem; border-radius:.25rem; background:#eef4f3; } .token sup { color:#176d6c; font-size:.61rem; font-weight:800; letter-spacing:.02em; } .token.mixed { background:#fff0dc; } .token.mixed sup { color:#9a5428; } .no-labels { margin:.35rem 0 0; color:var(--muted); font-size:.9rem; } .loading,.empty { padding:2rem; color:var(--muted); text-align:center; }
    @media (max-width:780px) { .filters,.layout { grid-template-columns:1fr; } .records { height:250px; } .meta { grid-template-columns:1fr 1fr; } } @media (max-width:440px) { .meta { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><div class="wrap"><p class="eyebrow">Bangor Miami Spanish–English Corpus</p><h1>Processed audio analysis</h1><p>Review each VAD-manifest entry with its source segment, transcript, metadata, and an interactive waveform.</p></div></header>
  <main class="wrap">
    <div class="filters"><label>Search transcript or filename<input id="search" type="search" placeholder="e.g. familia, maria1"></label><label>Filtered out<select id="status"><option value="all">All records</option><option value="false">Not filtered out</option><option value="true">Filtered out</option></select></label></div>
    <div class="layout"><aside class="panel"><div class="list-head"><span id="resultCount">Loading…</span><span>records</span></div><div id="records" class="records"></div></aside><section class="panel detail" aria-live="polite"><div id="detail"><p class="loading">Loading the VAD manifest…</p></div></section></div>
  </main>
  <script>
    const configParameter = new URLSearchParams(location.search).get('config') || '../dataset.json';
    const configUrl = new URL(configParameter, location.href);
    const search = document.querySelector('#search'), status = document.querySelector('#status');
    const recordsEl = document.querySelector('#records'), detail = document.querySelector('#detail'), count = document.querySelector('#resultCount');
    let rows = [], active = null, audioContext, dataset, manifestUrl, sourceDirectory;
    const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
    function languageTokens(row) { try { const labels=JSON.parse(row.word_langids || '[]'); return Array.isArray(labels) ? labels.filter(item=>item && item.word && item.langid) : []; } catch { return []; } }
    function languageTranscript(row) { const labels=languageTokens(row); if (!labels.length) return '<p class="no-labels">No token-language labels are present in this manifest. Re-run the pipeline to add them.</p>'; return `<p class="transcript">${labels.map(item=>`<span class="token ${/[&+]/.test(item.langid)?'mixed':''}">${escape(item.word)}<sup>${escape(item.langid)}</sup></span>`).join('')}</p>`; }
    function parseCsv(text) { const output = []; let row = [], field = '', quoted = false; for (let i=0;i<text.length;i++) { const char=text[i], next=text[i+1]; if (char==='"' && quoted && next==='"') { field+='"'; i++; } else if (char==='"') quoted=!quoted; else if (char===',' && !quoted) { row.push(field); field=''; } else if ((char==='\n' || char==='\r') && !quoted) { if (char==='\r' && next==='\n') i++; row.push(field); if (row.some(Boolean)) output.push(row); row=[]; field=''; } else field+=char; } if (field || row.length) { row.push(field); output.push(row); } const [headers,...data]=output; return data.map(values => Object.fromEntries(headers.map((key,index)=>[key,values[index] ?? '']))); }
    function originalPath(row) { return new URL(row.audio_path.split('/').pop(), sourceDirectory).href; }
    function visibleRows() { const term=search.value.trim().toLowerCase(), wanted=status.value; return rows.filter(row => (wanted==='all' || String(row.filtered_out).toLowerCase()===wanted) && (!term || `${row.audio_path} ${row.transcript} ${row.speakers}`.toLowerCase().includes(term))); }
    function renderList() { const visible=visibleRows(); count.textContent=visible.length.toLocaleString(); if (!visible.includes(active)) active=visible[0] || null; recordsEl.innerHTML=visible.length ? visible.map((row,i)=>`<button class="record" data-index="${rows.indexOf(row)}" aria-current="${row===active}"><span class="record-name">${escape(row.audio_path.split('/').pop())}</span><span class="record-sub">${escape(row.transcript)}</span><span class="status">${String(row.filtered_out).toLowerCase()==='true' ? 'Filtered out' : 'Kept'}</span></button>`).join('') : '<p class="empty">No matching records.</p>'; renderDetail(); }
    function renderDetail() { if (!active) { detail.innerHTML='<p class="empty">Choose a record to inspect it.</p>'; return; } const filtered=String(active.filtered_out).toLowerCase()==='true', name=active.audio_path.split('/').pop(), src=originalPath(active); detail.innerHTML=`<div class="detail-top"><h2>${escape(name)}</h2><span class="badge ${filtered?'out':''}">${filtered?'Filtered out':'Kept'}</span></div><audio id="audio" controls preload="metadata" src="${escape(src)}"></audio><canvas id="waveform" aria-label="Audio waveform; click to seek"></canvas><p class="wave-note">Waveform of the original timestamp segment. Click the waveform to seek.</p><dl class="meta"><div><dt>Source audio</dt><dd>${escape(active.source_audio)}</dd></div><div><dt>Time range</dt><dd>${Number(active.start_ms/1000).toFixed(3)}–${Number(active.end_ms/1000).toFixed(3)} s</dd></div><div><dt>Speakers</dt><dd>${escape(active.speakers)}</dd></div></dl><p class="transcript-label">Transcript with language tags</p>${languageTranscript(active)}`; const player=document.querySelector('#audio'), canvas=document.querySelector('#waveform'); player.addEventListener('loadedmetadata',()=>drawWaveform(player.src,canvas)); player.addEventListener('timeupdate',()=>drawPlayhead(canvas,player)); canvas.addEventListener('click',event=>{const rect=canvas.getBoundingClientRect(); player.currentTime=((event.clientX-rect.left)/rect.width)*player.duration;}); }
    async function drawWaveform(src, canvas) { const context=audioContext ||= new AudioContext(); try { const buffer=await (await fetch(src)).arrayBuffer(); const decoded=await context.decodeAudioData(buffer); canvas._decoded=decoded; canvas._waveReady=true; drawCanvas(canvas); } catch { canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); } }
    function drawCanvas(canvas) { const rect=canvas.getBoundingClientRect(), ratio=devicePixelRatio||1, width=Math.max(1,Math.round(rect.width*ratio)), height=Math.max(1,Math.round(rect.height*ratio)); canvas.width=width; canvas.height=height; const ctx=canvas.getContext('2d'), data=canvas._decoded.getChannelData(0), step=Math.ceil(data.length/width); ctx.fillStyle='#f4f7f6'; ctx.fillRect(0,0,width,height); ctx.strokeStyle='#0b7778'; ctx.lineWidth=ratio; ctx.beginPath(); for(let x=0;x<width;x++){let min=1,max=-1;for(let i=x*step;i<Math.min((x+1)*step,data.length);i++){const v=data[i];if(v<min)min=v;if(v>max)max=v;}ctx.moveTo(x,(1+min)*height/2);ctx.lineTo(x,(1+max)*height/2);}ctx.stroke(); }
    function drawPlayhead(canvas, player) { if (!canvas._waveReady) return; drawCanvas(canvas); const ctx=canvas.getContext('2d'), x=(player.currentTime/player.duration)*canvas.width; ctx.strokeStyle='#d85a38'; ctx.lineWidth=2*(devicePixelRatio||1); ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke(); }
    recordsEl.addEventListener('click',event=>{const button=event.target.closest('.record');if(button){active=rows[+button.dataset.index];renderList();}}); search.addEventListener('input',renderList); status.addEventListener('change',renderList); window.addEventListener('resize',()=>{const canvas=document.querySelector('#waveform');if(canvas?. _waveReady)drawCanvas(canvas);});
    fetch(configUrl).then(response=>{if(!response.ok)throw Error(response.status);return response.json();}).then(config=>{dataset=config;document.title=`${dataset.title || 'Corpus'} — Processed Audio Analysis`;manifestUrl=new URL(dataset.paths.vad_manifest,configUrl);sourceDirectory=new URL(dataset.paths.review_audio_dir.replace(/\/?$/, '/'),configUrl);return fetch(manifestUrl);}).then(response=>{if(!response.ok)throw Error(response.status);return response.text();}).then(text=>{rows=parseCsv(text);renderList();}).catch(()=>{detail.innerHTML='<p class="empty">The dataset configuration or manifest could not be loaded. Use <code>?config=path/to/dataset.json</code> and serve the files with a local web server.</p>';recordsEl.innerHTML='';count.textContent='0';});
  </script>
</body>
</html>
