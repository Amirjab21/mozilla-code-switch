<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miami Corpus — VAD comparison</title>
  <style>
    :root { --ink:#10232e; --muted:#64737c; --paper:#f7f5ef; --panel:#fff; --line:#d8e0e2; --accent:#d85a38; --aqua:#0b7778; --navy:#123d52; --warning:#fff0dc; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { background:var(--navy); color:#fff; padding:3.3rem 1.25rem 2.3rem; } .wrap { width:min(1240px,calc(100% - 2rem)); margin:auto; }
    .eyebrow { color:#9ddbd7; text-transform:uppercase; letter-spacing:.12em; font-size:.75rem; font-weight:800; margin:0 0 .45rem; } h1 { margin:0; font-size:clamp(2rem,5vw,3.6rem); letter-spacing:-.04em; line-height:1.08; } header p:last-child { max-width:760px; color:#d7e6e6; margin:1rem 0 0; }
    main { padding:1.6rem 0 4rem; } .filters { display:grid; grid-template-columns:1fr 210px 230px; gap:.85rem; margin-bottom:1.25rem; } label { display:grid; gap:.32rem; color:var(--muted); font-size:.78rem; font-weight:750; letter-spacing:.04em; text-transform:uppercase; }
    input,select { min-width:0; padding:.72rem .8rem; border:1px solid var(--line); border-radius:.45rem; font:400 1rem system-ui,sans-serif; color:var(--ink); background:#fff; text-transform:none; letter-spacing:normal; } .layout { display:grid; grid-template-columns:310px minmax(0,1fr); gap:1.25rem; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:.7rem; overflow:hidden; box-shadow:0 3px 16px #142b3509; } .list-head { display:flex; justify-content:space-between; padding:.9rem 1rem; border-bottom:1px solid var(--line); font-size:.85rem; color:var(--muted); } .records { height:68vh; overflow:auto; }
    button.record { display:block; width:100%; padding:.8rem 1rem; border:0; border-bottom:1px solid #edf0f1; background:#fff; text-align:left; color:var(--ink); cursor:pointer; } button.record:hover,button.record[aria-current="true"] { background:#e6f3f2; } .record-name { display:block; font-weight:750; font-size:.9rem; } .record-sub { display:block; color:var(--muted); font-size:.77rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .status { color:var(--aqua); font-size:.75rem; font-weight:800; } .status.out { color:#933c25; }
    .detail { padding:1.35rem; } .detail-top { display:flex; align-items:start; justify-content:space-between; gap:1rem; } h2 { margin:0; font-size:1.35rem; letter-spacing:-.02em; } .badge { border-radius:99px; background:#e6f3f2; color:#126467; padding:.2rem .55rem; font-size:.75rem; font-weight:800; white-space:nowrap; } .badge.out { color:#933c25; background:#fde9e3; }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; margin:1.15rem 0; } .stat { padding:.75rem; background:#f4f7f6; border-radius:.45rem; } .stat strong,.stat span { display:block; } .stat span { color:var(--muted); font-size:.71rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; } .stat strong { margin-top:.15rem; font-size:1.08rem; }
    .audio-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; } .audio-card { padding:1rem; border:1px solid var(--line); border-radius:.55rem; } .audio-card h3 { margin:0; font-size:1rem; } .audio-card p { margin:.2rem 0 0; color:var(--muted); font-size:.8rem; } audio { width:100%; margin:.75rem 0 .55rem; } canvas { width:100%; height:130px; display:block; background:#f4f7f6; border:1px solid var(--line); border-radius:.35rem; cursor:crosshair; } .wave-note { margin:.3rem 0 0; color:var(--muted); font-size:.76rem; }
    .meta { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin:1.25rem 0; } dt { color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; } dd { margin:.13rem 0 0; font-size:.92rem; overflow-wrap:anywhere; } .transcript-label { color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; } .transcript { margin:.35rem 0 0; font-size:1.03rem; line-height:1.75; } .loading,.empty { padding:2rem; color:var(--muted); text-align:center; }
    @media (max-width:840px) { .filters,.layout,.audio-grid { grid-template-columns:1fr; } .records { height:250px; } .summary { grid-template-columns:1fr 1fr; } } @media (max-width:440px) { .summary,.meta { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><div class="wrap"><p class="eyebrow">Bangor Miami Spanish–English Corpus</p><h1>VAD comparison</h1><p>Compare the timestamp-sliced clip from stage 01 with the silence-trimmed output from stage 02. Use low retention or filtered-out clips to find likely VAD mistakes.</p></div></header>
  <main class="wrap">
    <div class="filters"><label>Search transcript or filename<input id="search" type="search" placeholder="e.g. maria19, coño"></label><label>VAD result<select id="status"><option value="all">All clips</option><option value="kept">Kept</option><option value="filtered">Filtered out</option></select></label><label>Sort<select id="sort"><option value="original">Manifest order</option><option value="source-desc">Longest source clip</option><option value="source-asc">Shortest source clip</option></select></label></div>
    <div class="layout"><aside class="panel"><div class="list-head"><span id="resultCount">Loading…</span><span>clips</span></div><div id="records" class="records"></div></aside><section class="panel detail" aria-live="polite"><div id="detail"><p class="loading">Loading stage 01 and stage 02 manifests…</p></div></section></div>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const configUrl = new URL(query.get('config') || '../dataset.json', location.href);
    const search = document.querySelector('#search'), status = document.querySelector('#status'), sort = document.querySelector('#sort');
    const recordsEl = document.querySelector('#records'), detail = document.querySelector('#detail'), count = document.querySelector('#resultCount');
    let rows = [], active = null, audioContext, directories;
    const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const seconds = value => Number.isFinite(value) ? `${value.toFixed(2)} s` : 'Loading…';
    const parseCsv = text => { const output = []; let row = [], field = '', quoted = false; for (let i=0;i<text.length;i++) { const char=text[i], next=text[i+1]; if (char==='"' && quoted && next==='"') { field+='"'; i++; } else if (char==='"') quoted=!quoted; else if (char===',' && !quoted) { row.push(field); field=''; } else if ((char==='\n' || char==='\r') && !quoted) { if (char==='\r' && next==='\n') i++; row.push(field); if (row.some(Boolean)) output.push(row); row=[]; field=''; } else field+=char; } if (field || row.length) { row.push(field); output.push(row); } const [headers,...data]=output; return data.map(values => Object.fromEntries(headers.map((key,index)=>[key,values[index] ?? '']))); };
    const clipName = row => row.audio_path.split('/').pop();
    const sourceDuration = row => (Number(row.end_ms) - Number(row.start_ms)) / 1000;
    const audioUrl = (directory, row) => new URL(`${directory}${clipName(row)}`, configUrl).href;
    function filtered(row) { return String(row.vad.filtered_out).toLowerCase() === 'true'; }
    function visibleRows() { const term = search.value.trim().toLowerCase(); const wanted = status.value; const ordered = rows.filter(row => (wanted==='all' || (wanted==='filtered')===filtered(row)) && (!term || `${clipName(row.segment)} ${row.segment.transcript}`.toLowerCase().includes(term))); if (sort.value !== 'original') ordered.sort((a,b) => (sort.value==='source-desc' ? -1 : 1) * (sourceDuration(a.segment)-sourceDuration(b.segment))); return ordered; }
    function renderList() { const visible=visibleRows(); count.textContent=visible.length.toLocaleString(); if (!visible.includes(active)) active=visible[0] || null; recordsEl.innerHTML=visible.length ? visible.map(row=>`<button class="record" data-name="${escape(clipName(row.segment))}" aria-current="${row===active}"><span class="record-name">${escape(clipName(row.segment))}</span><span class="record-sub">${escape(row.segment.transcript)}</span><span class="status ${filtered(row)?'out':''}">${filtered(row)?'Filtered out':'Kept'} · source ${sourceDuration(row.segment).toFixed(2)} s</span></button>`).join('') : '<p class="empty">No matching clips.</p>'; renderDetail(); }
    function mediaCard(id, title, description, src, unavailable=false) { return `<div class="audio-card"><h3>${title}</h3><p>${description}</p>${unavailable ? '<p class="empty">No VAD audio was written because this clip was filtered out.</p>' : `<audio id="${id}" controls preload="metadata" src="${escape(src)}"></audio><canvas id="${id}-wave" aria-label="${title} waveform; click to seek"></canvas><p class="wave-note">Click waveform to seek.</p>`}</div>`; }
    function renderDetail() { if (!active) { detail.innerHTML='<p class="empty">Choose a clip to inspect it.</p>'; return; } const source=sourceDuration(active.segment), removed=filtered(active) ? source : null; detail.innerHTML=`<div class="detail-top"><h2>${escape(clipName(active.segment))}</h2><span class="badge ${filtered(active)?'out':''}">${filtered(active)?'Filtered out':'Kept by VAD'}</span></div><div class="summary"><div class="stat"><span>Stage 01 duration</span><strong>${seconds(source)}</strong></div><div class="stat"><span>Stage 02 duration</span><strong id="vadDuration">${filtered(active)?'—':'Loading…'}</strong></div><div class="stat"><span>Audio retained</span><strong id="retention">${filtered(active)?'0.0%':'Loading…'}</strong></div><div class="stat"><span>Audio removed</span><strong id="removed">${filtered(active)?seconds(removed):'Loading…'}</strong></div></div><div class="audio-grid">${mediaCard('sourceAudio','01 — timestamp segment','The clip extracted directly from CHAT timestamps.',audioUrl(directories.segments,active.segment))}${mediaCard('vadAudio','02 — VAD-trimmed clip','Silence removed only when a detected gap exceeds 2 seconds.',audioUrl(directories.vad,active.vad),filtered(active))}</div><dl class="meta"><div><dt>Source recording</dt><dd>${escape(active.segment.source_audio)}</dd></div><div><dt>Original time range</dt><dd>${(Number(active.segment.start_ms)/1000).toFixed(3)}–${(Number(active.segment.end_ms)/1000).toFixed(3)} s</dd></div><div><dt>Speakers</dt><dd>${escape(active.segment.speakers)}</dd></div></dl><p class="transcript-label">Transcript retained for both stages</p><p class="transcript">${escape(active.segment.transcript)}</p>`; attachMedia('sourceAudio'); if (!filtered(active)) attachMedia('vadAudio', source); }
    function attachMedia(id, sourceLength) { const player=document.querySelector(`#${id}`), canvas=document.querySelector(`#${id}-wave`); player.addEventListener('loadedmetadata',()=>{ if (sourceLength) { const retained=player.duration/sourceLength; document.querySelector('#vadDuration').textContent=seconds(player.duration); document.querySelector('#retention').textContent=`${(retained*100).toFixed(1)}%`; document.querySelector('#removed').textContent=seconds(Math.max(sourceLength-player.duration,0)); } drawWaveform(player.src,canvas); }); player.addEventListener('timeupdate',()=>drawPlayhead(canvas,player)); player.addEventListener('error',()=>{ if (id==='vadAudio') document.querySelector('#vadDuration').textContent='Unavailable'; }); canvas.addEventListener('click',event=>{const rect=canvas.getBoundingClientRect(); if (Number.isFinite(player.duration)) player.currentTime=((event.clientX-rect.left)/rect.width)*player.duration;}); }
    async function drawWaveform(src, canvas) { const context=audioContext ||= new AudioContext(); try { const decoded=await context.decodeAudioData(await (await fetch(src)).arrayBuffer()); canvas._decoded=decoded; canvas._waveReady=true; drawCanvas(canvas); } catch { canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); } }
    function drawCanvas(canvas) { if (!canvas._decoded) return; const rect=canvas.getBoundingClientRect(), ratio=devicePixelRatio||1, width=Math.max(1,Math.round(rect.width*ratio)), height=Math.max(1,Math.round(rect.height*ratio)); canvas.width=width; canvas.height=height; const ctx=canvas.getContext('2d'), data=canvas._decoded.getChannelData(0), step=Math.ceil(data.length/width); ctx.fillStyle='#f4f7f6'; ctx.fillRect(0,0,width,height); ctx.strokeStyle='#0b7778'; ctx.lineWidth=ratio; ctx.beginPath(); for(let x=0;x<width;x++){let min=1,max=-1;for(let i=x*step;i<Math.min((x+1)*step,data.length);i++){const v=data[i];if(v<min)min=v;if(v>max)max=v;}ctx.moveTo(x,(1+min)*height/2);ctx.lineTo(x,(1+max)*height/2);}ctx.stroke(); }
    function drawPlayhead(canvas, player) { if (!canvas?._waveReady) return; drawCanvas(canvas); const ctx=canvas.getContext('2d'), x=(player.currentTime/player.duration)*canvas.width; ctx.strokeStyle='#d85a38'; ctx.lineWidth=2*(devicePixelRatio||1); ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke(); }
    recordsEl.addEventListener('click',event=>{const button=event.target.closest('.record');if(button){active=rows.find(row=>clipName(row.segment)===button.dataset.name);renderList();}}); [search,status,sort].forEach(input=>input.addEventListener(input===search?'input':'change',renderList)); window.addEventListener('resize',()=>document.querySelectorAll('canvas').forEach(canvas=>drawCanvas(canvas)));
    fetch(configUrl).then(response=>{if(!response.ok)throw Error(response.status);return response.json();}).then(config=>{ const paths=config.paths; directories={segments:new URL(paths.review_audio_dir.replace(/\/?$/, '/'),configUrl).href, vad:new URL(paths.vad_audio_dir.replace(/\/?$/, '/'),configUrl).href}; const segmentManifest=new URL(query.get('segments_manifest') || paths.vad_manifest.replace('02_vad.csv','01_segments.csv'),configUrl); const vadManifest=new URL(query.get('vad_manifest') || paths.vad_manifest,configUrl); return Promise.all([fetch(segmentManifest),fetch(vadManifest)]); }).then(async responses=>{if(responses.some(response=>!response.ok))throw Error('Could not load a manifest'); const [segments,vad]=await Promise.all(responses.map(response=>response.text())); const vadByName=new Map(parseCsv(vad).map(row=>[clipName(row),row])); rows=parseCsv(segments).map(segment=>({segment,vad:vadByName.get(clipName(segment))})).filter(row=>row.vad); renderList(); }).catch(error=>{detail.innerHTML=`<p class="empty">The comparison manifests could not be loaded: ${escape(error.message)}.</p>`;recordsEl.innerHTML='';count.textContent='0';});
  </script>
</body>
</html>
